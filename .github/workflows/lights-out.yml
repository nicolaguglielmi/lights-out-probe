# lights-out on this repository (a probe: docs/adr/0057 §7 of
# nicolaguglielmi/lights-out). The root Action and the two standalone
# Actions on every pull request, at v0.3.0, the published gates image.
# Each runs in a job of its own, on a runner that has never seen the
# image, so each time includes the first pull: from the step's start to
# its check run.
name: lights-out

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: t0
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: run
        uses: nicolaguglielmi/lights-out@v0.3.0
      - if: always()
        name: The verdict and its time, first pull included
        env:
          T0: ${{ steps.t0.outputs.t }}
          LINE: ${{ steps.run.outputs.line }}
          URL: ${{ steps.run.outputs.check_url }}
        run: |
          { echo '### gates, first pull included'; echo '```'
            echo "gates $(( $(date +%s) - T0 ))s  $LINE  $URL"
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  test-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: t0
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: run
        uses: ./.github/actions/test-proof
      - if: always()
        name: The verdict and its time, first pull included
        env:
          T0: ${{ steps.t0.outputs.t }}
          LINE: ${{ steps.run.outputs.line }}
          URL: ${{ steps.run.outputs.check_url }}
        run: |
          { echo '### test-proof, first pull included'; echo '```'
            echo "test-proof $(( $(date +%s) - T0 ))s  $LINE  $URL"
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  test-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: t0
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: run
        uses: ./.github/actions/test-integrity
      - if: always()
        name: The verdict and its time, first pull included
        env:
          T0: ${{ steps.t0.outputs.t }}
          LINE: ${{ steps.run.outputs.line }}
          URL: ${{ steps.run.outputs.check_url }}
        run: |
          { echo '### test-integrity, first pull included'; echo '```'
            echo "test-integrity $(( $(date +%s) - T0 ))s  $LINE  $URL"
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
